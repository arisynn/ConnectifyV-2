  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#38bdf8">
    <title>Connectify</title>
    
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body style="margin: 0; padding: 0; overscroll-behavior-y: none; background-color: #38bdf8;">
    
    <style>
      html, body {
        background-color: #FFD84D !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      #static-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #FFD84D;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .static-loader-bg {
        position: absolute;
        inset: 0;
        opacity: 0.1;
        pointer-events: none;
        background-image: radial-gradient(circle at center, #000 2px, transparent 2px);
        background-size: 24px 24px;
      }
      .static-loader-logo-container {
        width: 128px;
        height: 128px;
        margin-bottom: 32px;
        position: relative;
        z-index: 10;
        animation: static-float 3s ease-in-out infinite;
      }
      .static-loader-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
      }
      .static-loader-card {
        background-color: #FFFFFF;
        border: 3px solid #111827;
        border-radius: 1rem;
        padding: 12px 24px;
        box-shadow: 4px 5px 0px 0px rgba(0,0,0,1);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .static-loader-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 900;
        color: #111827;
        font-size: 1.125rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 0;
      }
      .static-loader-progress-bar-container {
        width: 200px;
        height: 8px;
        background-color: #E5E7EB;
        border: 2px solid #111827;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 4px;
      }
      .static-loader-progress-bar {
        height: 100%;
        width: 30%;
        background-color: #FF6B8A;
        border-radius: 9999px;
        animation: static-progress 1.5s infinite linear;
        transform-origin: left;
      }
      @keyframes static-float {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      @keyframes static-progress {
        0% { transform: translateX(-100%); width: 30%; }
        50% { width: 50%; }
        100% { transform: translateX(350%); width: 30%; }
      }
      
      /* Stop indeterminate animation when js takes over */
      .static-loader-progress-bar.determinate {
        animation: none !important;
        transition: width 0.2s ease-out;
      }
    </style>

    <script>
      (function() {
        var loaderText = document.getElementById('static-loader-text');
        var errorText = document.getElementById('static-loader-error');
        var retryBtn = document.getElementById('static-loader-retry');
        var progressBar = document.getElementById('static-loader-progress');
        window._loaderReady = false;
        
        window.addEventListener('error', function(e) {
          if (errorText && !window._loaderReady) {
            errorText.innerText = 'Error: ' + (e.message || 'Script failed');
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (errorText && !window._loaderReady) {
            errorText.innerText = 'Error: ' + (e.reason || 'Promise rejected');
          }
        });
        
        if (retryBtn) {
           retryBtn.addEventListener('click', function() {
              window.location.reload();
           });
        }

        setTimeout(function() {
          if (!window._loaderReady && loaderText) {
             loaderText.innerText = 'MEMUAT APP...';
          }
        }, 4000);

        setTimeout(function() {
          if (!window._loaderReady) {
            if (progressBar) progressBar.style.animation = 'none';
            if (errorText) errorText.innerText = 'Gagal memuat. Cek koneksi internetmu.';
            if (retryBtn) retryBtn.style.display = 'block';
          }
        }, 12000);
      })();
